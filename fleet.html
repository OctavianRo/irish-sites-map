<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Route Planner — Ireland</title>
<meta name="description" content="Load an order book of Eircode deliveries, respect vehicle weight limits and road suitability, and get an optimised route plan per driver.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1216'/%3E%3Cpath d='M4 20h13V10H8L4 15z' fill='%2338bdf8'/%3E%3Crect x='18' y='8' width='10' height='12' rx='1' fill='%2338bdf8'/%3E%3Ccircle cx='9' cy='23' r='3' fill='%239aa7b4'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%239aa7b4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/planner.css">
</head>
<body>
<div class="app">

  <!-- ================================================ orders + fleet ==== -->
  <section class="col">
    <div class="chead">
      <div>
        <h1>Delivery Route Planner</h1>
        <div class="sub">Eircode order book → load plan → route</div>
      </div>
      <div class="spacer"></div>
      <a class="btn small ghost" href="index.html" title="Construction site map">Sites map</a>
    </div>

    <nav class="tabs" id="ltabs">
      <button class="tab on" data-ltab="orders">Orders <span class="badge" id="b-orders">0</span></button>
      <button class="tab" data-ltab="fleet">Fleet <span class="badge" id="b-fleet">0</span></button>
      <button class="tab" data-ltab="settings">Settings</button>
    </nav>

    <div class="scroll" id="lpane"></div>

    <div class="footbar">
      <button class="btn primary" id="btn-plan">Build the plan</button>
      <button class="btn" id="btn-csv" title="Copy the plan as CSV">Export</button>
    </div>
  </section>

  <!-- ==================================================== map ========== -->
  <section class="col col-map">
    <div id="map"></div>
    <div class="mapnote" id="mapnote">Drops are placed by Eircode routing area unless the order line carried coordinates.</div>
    <div class="maplegend" id="maplegend"></div>
  </section>

  <!-- ================================================== the plan ======= -->
  <section class="col">
    <div class="chead">
      <h2 id="res-title">Plan</h2>
      <div class="spacer"></div>
      <span class="small dim" id="res-sub"></span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="loads">Loads</button>
      <button class="tab" data-tab="day">Driver day</button>
      <button class="tab" data-tab="roads">Roads <span class="badge" id="b-roads">0</span></button>
      <button class="tab" data-tab="ref">Reference</button>
    </nav>
    <div class="scroll" id="pane"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/sites-index.js"></script>
<script src="assets/eircode.js"></script>
<script src="assets/vehicles.js"></script>
<script src="assets/network.js"></script>
<script src="assets/orders.js"></script>
<script src="assets/planner.js"></script>
<script src="assets/ui.js"></script>
</body>
</html>
